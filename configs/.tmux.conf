# Plugins
set -g @plugin 'thewtex/tmux-mem-cpu-load'

# Colors (tmux-256color + RGB gives true color; needs tmux 3.2+)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Prefix: C-s instead of C-b
set -g prefix C-s
unbind C-b

# Vim-like keys
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Mouse
set -g mouse on

# Remove right-click context menus
unbind -n MouseDown3Pane
unbind -n M-MouseDown3Pane
unbind -n MouseDown3Status
unbind -n MouseDown3StatusLeft
unbind -n MouseDown3StatusRight

# Drag keeps the selection, right-click copies and exits
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDown3Pane send -X copy-pipe-and-cancel "pbcopy"

# Status bar
set -g status-interval 1
set -g status-justify centre
set -g status-keys vi
set -g status-style fg=colour136,bg=colour235
set -g status-left-length 20
set -g status-left "#[fg=green,bold]#(whoami)"
set -g status-right-length 140
set -g status-right "#[fg=green,bold]#(tmux-mem-cpu-load -a 0) "
setw -g window-status-current-style fg=colour166,bg=default